<div class="admin-shell">

  <!-- ── Sidebar ──────────────────────────────────────────── -->
  <aside class="admin-sidebar" [class.admin-sidebar--open]="sidebarAbierto()">

    <!-- Logo -->
    <div class="admin-sidebar__brand">
      <a routerLink="/" class="admin-sidebar__logo">SNEARK</a>
      <span class="admin-sidebar__badge">Admin</span>
    </div>

    <!-- Nav links -->
    <nav class="admin-sidebar__nav" aria-label="Navegación admin">
      <a routerLink="/admin" routerLinkActive="admin-nav-link--activo"
         [routerLinkActiveOptions]="{ exact: true }"
         class="admin-nav-link" (click)="cerrarSidebar()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
        </svg>
        Dashboard
      </a>

      <a routerLink="/admin/pedidos" routerLinkActive="admin-nav-link--activo"
         class="admin-nav-link" (click)="cerrarSidebar()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
        Pedidos
      </a>

      <a routerLink="/admin/productos" routerLinkActive="admin-nav-link--activo"
         class="admin-nav-link" (click)="cerrarSidebar()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        Productos
      </a>

      <a routerLink="/admin/marcas" routerLinkActive="admin-nav-link--activo"
         class="admin-nav-link" (click)="cerrarSidebar()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M8.56 2.75c4.37 6.03 6.02 9.42 8.03 17.72m2.54-15.38c-3.72 4.35-8.94 5.66-16.88 5.85m19.5 1.9c-3.5-.93-6.63-.82-8.94 0-2.58.92-5.01 2.86-7.44 6.32"/>
        </svg>
        Marcas
      </a>

      <a routerLink="/admin/categorias" routerLinkActive="admin-nav-link--activo"
         class="admin-nav-link" (click)="cerrarSidebar()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        Categorías
      </a>
    </nav>

    <!-- Usuario + logout -->
    <div class="admin-sidebar__footer">
      <div class="admin-sidebar__user">
        <div class="admin-sidebar__avatar">
          {{ auth.usuario()?.nombre?.charAt(0).toUpperCase() }}
        </div>
        <div class="admin-sidebar__user-info">
          <p class="admin-sidebar__user-name">{{ auth.usuario()?.nombre }}</p>
          <p class="admin-sidebar__user-role">Administrador</p>
        </div>
      </div>
      <button class="admin-sidebar__logout" (click)="logout()" aria-label="Cerrar sesión">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>

  </aside>

  <!-- Overlay mobile -->
  @if (sidebarAbierto()) {
    <div class="admin-overlay" (click)="cerrarSidebar()"></div>
  }

  <!-- ── Contenido principal ─────────────────────────────── -->
  <div class="admin-content">

    <!-- Topbar mobile -->
    <header class="admin-topbar">
      <button class="admin-topbar__menu" (click)="toggleSidebar()" aria-label="Abrir menú">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <span class="admin-topbar__logo">SNEARK Admin</span>
      <a routerLink="/" class="admin-topbar__ver-tienda">Ver tienda</a>
    </header>

    <main class="admin-main">
      <router-outlet />
    </main>

  </div>

</div>
