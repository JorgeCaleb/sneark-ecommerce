<div class="auth-page">
  <div class="auth-card animate-fade-up">

    <!-- Logo -->
    <a routerLink="/" class="auth-card__logo">SOHO</a>

    <div class="auth-card__header">
      <h1 class="auth-card__title">Crear cuenta</h1>
      <p class="auth-card__subtitle">Registrate gratis y empezá a comprar</p>
    </div>

    <form class="auth-form" (ngSubmit)="submit()">

      <!-- Nombre -->
      <div class="form-field">
        <label class="form-label" for="nombre">Nombre completo</label>
        <div class="form-input-wrap">
          <svg class="form-input-icon" width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input
            id="nombre"
            type="text"
            class="form-input form-input--icon"
            placeholder="Tu nombre"
            [(ngModel)]="nombre"
            name="nombre"
            autocomplete="name"
            maxlength="100"
            required
          />
        </div>
      </div>

      <!-- Email -->
      <div class="form-field">
        <label class="form-label" for="email">Email</label>
        <div class="form-input-wrap">
          <svg class="form-input-icon" width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input
            id="email"
            type="email"
            class="form-input form-input--icon"
            placeholder="tu@email.com"
            [(ngModel)]="email"
            name="email"
            autocomplete="email"
            required
          />
        </div>
      </div>

      <!-- Password -->
      <div class="form-field">
        <label class="form-label" for="password">Contraseña</label>
        <div class="form-input-wrap">
          <svg class="form-input-icon" width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input
            id="password"
            [type]="mostrarPass() ? 'text' : 'password'"
            class="form-input form-input--icon form-input--icon-right"
            placeholder="Mínimo 8 caracteres"
            minlength="8"
            [(ngModel)]="password"
            name="password"
            autocomplete="new-password"
            required
          />
          <button type="button" class="form-input-toggle" (click)="togglePass()"
                  [attr.aria-label]="mostrarPass() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            @if (mostrarPass()) {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            } @else {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            }
          </button>
        </div>
      </div>

      <!-- Confirmar password -->
      <div class="form-field">
        <label class="form-label" for="confirmar">Confirmar contraseña</label>
        <div class="form-input-wrap">
          <svg class="form-input-icon" width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <input
            id="confirmar"
            [type]="mostrarPass() ? 'text' : 'password'"
            class="form-input form-input--icon"
            placeholder="Repetí la contraseña"
            [(ngModel)]="confirmar"
            name="confirmar"
            autocomplete="new-password"
            required
          />
        </div>
      </div>

      <!-- Indicador de coincidencia -->
      @if (password && confirmar) {
        <div class="registro__match" [class.registro__match--ok]="password === confirmar"
             [class.registro__match--err]="password !== confirmar">
          @if (password === confirmar) {
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            Las contraseñas coinciden
          } @else {
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
            Las contraseñas no coinciden
          }
        </div>
      }

      <!-- Error general -->
      @if (error()) {
        <div class="auth-error animate-fade-up">{{ error() }}</div>
      }

      <!-- Submit -->
      <button type="submit" class="btn-primary auth-submit" [disabled]="enviando()">
        @if (enviando()) {
          <span class="auth-spinner"></span>
          Creando cuenta...
        } @else {
          Crear cuenta
        }
      </button>

    </form>

    <p class="auth-card__footer">
      ¿Ya tenés cuenta?
      <a routerLink="/auth/login" class="auth-card__link">Iniciá sesión</a>
    </p>

  </div>
</div>
