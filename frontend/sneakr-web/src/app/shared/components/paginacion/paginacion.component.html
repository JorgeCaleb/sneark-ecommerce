@if (modo() === 'editorial') {
  <nav class="paginacion-editorial" [attr.aria-label]="ariaLabel()">
    <button type="button" [disabled]="pagina() <= 1" (click)="irAPagina(pagina() - 1)" aria-label="Página anterior"><ng-icon name="lucideChevronLeft" size="18" /></button>
    <span class="pagina-actual" aria-current="page" [attr.aria-label]="'Página ' + pagina()">{{ pagina() }}</span>
    <span>de {{ totalPaginas() }}</span>
    <button type="button" [disabled]="pagina() >= totalPaginas()" (click)="irAPagina(pagina() + 1)" aria-label="Página siguiente"><ng-icon name="lucideChevronRight" size="18" /></button>
  </nav>
} @else if (totalPaginas() > 1) {
  <nav class="paginacion" [class.paginacion--compacto]="modo() === 'compacto'" [attr.aria-label]="ariaLabel()">
    @if (modo() === 'compacto') {
      <button
        class="btn-secondary paginacion__nav-btn"
        type="button"
        [disabled]="pagina() <= 1"
        (click)="irAPagina(pagina() - 1)"
      >
        Anterior
      </button>

      <span aria-live="polite" class="paginacion__info">
        Página {{ pagina() }} de {{ totalPaginas() }}
      </span>

      <button
        class="btn-secondary paginacion__nav-btn"
        type="button"
        [disabled]="pagina() >= totalPaginas()"
        (click)="irAPagina(pagina() + 1)"
      >
        Siguiente
      </button>
    } @else {
      <button
        class="paginacion__btn"
        type="button"
        [disabled]="pagina() <= 1"
        (click)="irAPagina(pagina() - 1)"
        aria-label="Página anterior"
      >
        <ng-icon name="lucideChevronLeft" size="16" />
      </button>

      @for (p of paginasArray(); track p) {
        <button
          class="paginacion__num"
          type="button"
          [class.paginacion__num--activa]="p === pagina()"
          (click)="irAPagina(p)"
        >
          {{ p }}
        </button>
      }

      <button
        class="paginacion__btn"
        type="button"
        [disabled]="pagina() >= totalPaginas()"
        (click)="irAPagina(pagina() + 1)"
        aria-label="Página siguiente"
      >
        <ng-icon name="lucideChevronRight" size="16" />
      </button>
    }
  </nav>
}
